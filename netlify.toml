[build]
  command = "rm -rf node_modules && npm install && CI=false npm run build"
  publish = "build"

# ── Security & Performance Headers ──────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"

    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"

    # Force HTTPS for 1 year, include subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Disable FLoC / invasive browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

    # XSS protection (legacy browsers)
    X-XSS-Protection = "1; mode=block"

    # Content Security Policy
    # Allows: self, Google Fonts, Unsplash images, EmailJS
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://ui-avatars.com https://cdn.jsdelivr.net https://www.vectorlogo.zone https://upload.wikimedia.org https://avatars.githubusercontent.com https://cdn.simpleicons.org https://railway.com https://www.ibm.com https://openai.com https://n8n.io https://lovable.dev https://stability.ai https://filmora.wondershare.com https://lottiefiles.com https://uizard.io https://www.visily.ai https://ahrefs.com https://razorpay.com https://www.zoho.com https://www.theforage.com; connect-src 'self' https://api.emailjs.com; frame-src https://drive.google.com https://docs.google.com; object-src 'none'; base-uri 'self';"

    # Prevent browsers from caching sensitive responses
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Cache static assets aggressively ────────────────────────────────────
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── SPA Redirect (React Router) ─────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
